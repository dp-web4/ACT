# Society 4 Private Blockchain Configuration
# This chain is completely isolated from the federation for internal operations

# Base Configuration
proxy_app = "tcp://127.0.0.1:26658"
moniker = "society4-private"
fast_sync = true
db_backend = "goleveldb"
db_dir = "data"
log_level = "info"
log_format = "plain"
genesis_file = "config/genesis.json"
priv_validator_key_file = "config/priv_validator_key.json"
priv_validator_state_file = "data/priv_validator_state.json"
priv_validator_laddr = ""
node_key_file = "config/node_key.json"
abci = "socket"
filter_peers = false

# RPC Server Configuration
[rpc]
laddr = "tcp://127.0.0.1:26657"  # Local only - no external access
cors_allowed_origins = ["http://localhost"]
cors_allowed_methods = ["HEAD", "GET", "POST"]
cors_allowed_headers = ["Origin", "Accept", "Content-Type"]
grpc_laddr = ""
grpc_max_open_connections = 900
unsafe = false  # Safety first for private chain
max_open_connections = 900
max_subscription_clients = 100
max_subscriptions_per_client = 5
timeout_broadcast_tx_commit = "10s"
max_body_bytes = 1000000
max_header_bytes = 1048576
tls_cert_file = ""
tls_key_file = ""
pprof_laddr = ""

# P2P Configuration
[p2p]
laddr = ""  # No P2P - single validator
external_address = ""  # Not externally accessible
seeds = ""  # No seeds - isolated chain
persistent_peers = ""  # No peers - standalone
upnp = false
addr_book_file = "config/addrbook.json"
addr_book_strict = true
max_num_inbound_peers = 0  # No inbound connections
max_num_outbound_peers = 0  # No outbound connections
unconditional_peer_ids = ""
persistent_peers_max_dial_period = "0s"
flush_throttle_timeout = "100ms"
max_packet_msg_payload_size = 1024
send_rate = 5120000
recv_rate = 5120000
pex = false  # No peer exchange
seed_mode = false
private_peer_ids = ""
allow_duplicate_ip = false
handshake_timeout = "20s"
dial_timeout = "3s"

# Mempool Configuration
[mempool]
version = "v0"
recheck = true
broadcast = false  # No broadcasting - single node
wal_dir = ""
size = 5000
max_txs_bytes = 1073741824
cache_size = 10000
keep-invalid-txs-in-cache = false
max_tx_bytes = 1048576
max_batch_bytes = 0
ttl-duration = "0s"
ttl-num-blocks = 0

# State Sync Configuration
[statesync]
enable = false  # No state sync - genesis chain
rpc_servers = ""
trust_height = 0
trust_hash = ""
trust_period = "0s"
discovery_time = "0s"
temp_dir = ""
chunk_request_timeout = "10s"
chunk_fetchers = "4"

# Consensus Configuration
[consensus]
wal_file = "data/cs.wal/wal"
timeout_propose = "1s"  # Fast for single validator
timeout_propose_delta = "100ms"
timeout_prevote = "500ms"
timeout_prevote_delta = "100ms"
timeout_precommit = "500ms"
timeout_precommit_delta = "100ms"
timeout_commit = "1s"  # 1 second blocks
double_sign_check_height = 0
skip_timeout_commit = false
create_empty_blocks = true  # Always create blocks
create_empty_blocks_interval = "1s"  # Every second
peer_gossip_sleep_duration = "100ms"
peer_query_maj23_sleep_duration = "2s"

# Storage Configuration
[storage]
discard_abci_responses = false

# Transaction Indexer Configuration
[tx_index]
indexer = "kv"
psql-conn = ""

# Instrumentation Configuration
[instrumentation]
prometheus = false
prometheus_listen_addr = ""
max_open_connections = 3
namespace = "tendermint"

# Society 4 Specific Settings
[society4]
hardware_binding_check_interval = "1h"
lct_generation_enabled = true
role_atp_recharge_interval = "1h"
federation_bridge_sync_interval = "5m"
private_data_dir = "../private"
witness_accumulation_threshold = 3