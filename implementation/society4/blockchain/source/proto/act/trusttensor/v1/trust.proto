syntax = "proto3";
package act.trusttensor.v1;

import "gogoproto/gogo.proto";
import "cosmos_proto/cosmos.proto";

option go_package = "github.com/dp-web4/act/x/trusttensor/types";

// TrustTensor represents T3 (Trust) dimensions per Web4 canonical spec
message TrustTensor {
  // Talent — innate or role-specific capability
  string talent = 1 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "github.com/cosmos/cosmos-sdk/types.Dec",
    (gogoproto.nullable) = false
  ];

  // Training — learned skills and demonstrated growth
  string training = 2 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "github.com/cosmos/cosmos-sdk/types.Dec",
    (gogoproto.nullable) = false
  ];

  // Temperament — consistency, ethics, behavioral stability
  string temperament = 3 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "github.com/cosmos/cosmos-sdk/types.Dec",
    (gogoproto.nullable) = false
  ];
}

// ValueTensor represents V3 (Value) dimensions per Web4 canonical spec
message ValueTensor {
  // Valuation — economic or utility value
  string valuation = 1 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "github.com/cosmos/cosmos-sdk/types.Dec",
    (gogoproto.nullable) = false
  ];

  // Veracity — truthfulness and accuracy
  string veracity = 2 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "github.com/cosmos/cosmos-sdk/types.Dec",
    (gogoproto.nullable) = false
  ];

  // Validity — logical soundness and applicability
  string validity = 3 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "github.com/cosmos/cosmos-sdk/types.Dec",
    (gogoproto.nullable) = false
  ];
}

// TrustRelationship defines trust between two entities
message TrustRelationship {
  string source_lct = 1;
  string target_lct = 2;
  TrustTensor trust = 3 [(gogoproto.nullable) = false];
  ValueTensor value = 4 [(gogoproto.nullable) = false];
  
  // Trust degradation with distance
  uint32 distance = 5;
  string degradation_factor = 6 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "github.com/cosmos/cosmos-sdk/types.Dec",
    (gogoproto.nullable) = false
  ];
  
  // Trust-as-gravity calculation
  string gravity_coefficient = 7 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "github.com/cosmos/cosmos-sdk/types.Dec",
    (gogoproto.nullable) = false
  ];
}